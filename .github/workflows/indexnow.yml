name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/submit-indexnow.mjs"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit sitemap URLs
        run: node scripts/submit-indexnow.mjs https://foldoraai.com 839f2842d8524e31834cb65acfb22d4c docs/sitemap.xml
